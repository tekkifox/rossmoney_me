version: "3.8"

# Standalone Trivy scanning stack. Not part of the site stack.
#
#   docker compose -f docker-compose.trivy.yml up -d
#
# No host ports are published. Trivy stays on the internal `trivy` network only;
# the report dashboard lives in docker-compose.monitoring.yml and reads the same
# shared report volume:
#   trivy API  http://trivy:8080 (internal, this file)
#   dashboard  http://172.18.0.22:8083 (docker-compose.monitoring.yml)
#   reports    volume rossmoney_monitoring-reports
#
# One-shot full sweep (host OS + every image on the daemon). This is a job, not
# a service: it runs to completion and exits, so it has no profiles and no ports.
#   docker compose -f docker-compose.trivy.yml run --rm scan
#
# On-demand scans:
#   docker compose -f docker-compose.trivy.yml run --rm trivy image ghcr.io/tekkifox/rossmoney_me-cms:latest
#   docker compose -f docker-compose.trivy.yml run --rm trivy rootfs /host
#
# The Trivy API can enumerate and scan local images exposed through the
# read-only socket proxy, e.g. POST /scan {"target":"ghcr.io/tekkifox/archview:latest"}.

services:
  # No separate DB sidecar: aquasec/trivy-db is scratch-based and has no /bin/sh,
  # so it cannot run an entrypoint script. The Trivy server and the scan job share
  # one bind-mounted cache and download/update trivy-db themselves.
  #
  # Server/client split: the server holds the warm cache, so on-demand API scans
  # reuse downloaded vulnerability data instead of re-fetching it.
  # Read-only TCP proxy in front of the Docker socket. The scanner talks to this
  # over the internal network instead of mounting docker.sock, which would be
  # root-equivalent on the host. CONTAINERS restricts the API to read-only calls
  # that image listing and inspection need; post/delete and exec are refused.
  docker-api:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: trivy-docker-api
    environment:
      # No CONTAINERS=1 restriction: the scanner must see every image on the host.
      # PING=1 is used for the healthcheck below.
      PING: "1"
      VERSION: "1"
      INFO: "1"
      IMAGES: "1"
      CONTAINERS: "1"
      POST: "0"
      NETWORKS: "1"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      NODES: "0"
      BUILD: "0"
      COMMIT: "0"
      EXEC: "0"
      PLUGINS: "0"
      SWARM: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - trivy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  trivy:
    build:
      context: ./trivy
      dockerfile: Dockerfile
    image: rossmoney-trivy:latest
    # Non-root. Built into the image, since the upstream default user is root.
    user: "1001:1001"
    command:
      - server
      - --listen=0.0.0.0:8080
      - --cache-dir=/var/cache/trivy
      # Note: `trivy server` has no --scanners flag; scanners are chosen by the
      # client. --no-progress/--quiet keep the container log clean.
      - --no-progress
      - --quiet
    environment:
      HOME: /tmp
      TRIVY_CACHE_DIR: /var/cache/trivy
    volumes:
      - trivy-db:/var/cache/trivy
      # Host filesystem, used for OS package and secret scanning
      - /:/host:ro
      - monitoring-reports:/reports
    expose:
      - "8080"
    # Hard cap; honoured by Compose v2 without swarm. Keeps an on-demand API
    # scan from saturating the host.
    deploy:
      resources:
        limits:
          cpus: "${TRIVY_CPUS:-2.0}"
          memory: ${TRIVY_MEMORY:-2G}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "trivy", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      docker-api:
        condition: service_healthy
    networks:
      - trivy

  # Full sweep: host OS packages, secrets on disk, and every image the Docker
  # daemon reports. One-shot job, not a long-running service:
  #   docker compose -f docker-compose.trivy.yml run --rm scan
  scan:
    build:
      context: ./trivy
      dockerfile: Dockerfile
    image: rossmoney-trivy:latest
    user: "1001:1001"
    environment:
      HOME: /tmp
      TRIVY_CACHE_DIR: /var/cache/trivy
      REPORT_DIR: /reports
      # Read-only Docker API via the socket proxy, not the raw socket. The proxy
      # denies POST/EXEC, so a compromised scanner cannot mutate the host.
      DOCKER_API: http://docker-api:2375
      SEVERITY: ${TRIVY_SCAN_SEVERITY:-HIGH,CRITICAL}
      IGNORE_UNFIXED: ${TRIVY_SCAN_IGNORE_UNFIXED:-true}
      # Space-separated host paths to skip during the OS scan, e.g. large media
      # mounts. Defaults skip the Docker root (overlayfs snapshots are unreadable
      # from a bind mount), pseudo-filesystems and other non-scannable trees.
      SKIP_DIRS: ${TRIVY_SKIP_DIRS:-/host/var/lib/docker /host/proc /host/sys /host/dev /host/run /host/mnt/media /host/mnt/hbrr/media}
      # Optional extra images for per-image HTML reports, on top of whatever the
      # daemon already reports.
      IMAGES: ${TRIVY_SCAN_IMAGES:-}
      # Also emit CycloneDX and SPDX SBOMs alongside the vulnerability reports.
      SBOM: ${TRIVY_SCAN_SBOM:-true}
    volumes:
      # Separate cache from the trivy server: Trivy takes an exclusive lock on
      # its cache dir, so a scan job sharing the server's volume fails with
      # "Failed to acquire cache or database lock".
      - trivy-db-scan:/var/cache/trivy
      - /:/host:ro
      - monitoring-reports:/reports
    depends_on:
      docker-api:
        condition: service_healthy
    networks:
      - trivy
    # The full sweep is the heaviest step, so it gets its own cap. Scans are
    # largely I/O bound on the DB, so this slows wall time rather than results.
    deploy:
      resources:
        limits:
          cpus: "${TRIVY_SCAN_CPUS:-2.0}"
          memory: ${TRIVY_SCAN_MEMORY:-2G}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # NOTE: every shell variable below is written $$var so Compose does not
        # interpolate it away at parse time.
        echo "REPORT_DIR=$$REPORT_DIR"
        echo "DOCKER_API=$$DOCKER_API"
        echo "SEVERITY=$$SEVERITY"
        echo "IGNORE_UNFIXED=$$IGNORE_UNFIXED"
        echo "SKIP_DIRS=$$SKIP_DIRS"
        echo "IMAGES=$$IMAGES"
        echo "SBOM=$$SBOM"

        mkdir -p "$$REPORT_DIR" || echo "FATAL: cannot create $$REPORT_DIR"
        echo "Report dir contents before scan:"
        ls -la "$$REPORT_DIR" || true

        # curl is baked into the image; the container runs as uid 1001 so it
        # cannot apk add at runtime.
        if ! command -v curl >/dev/null 2>&1; then
          echo "ERROR: curl missing from image; cannot enumerate images"
        fi

        if [ "$$IGNORE_UNFIXED" = "true" ]; then
          flags="--ignore-unfixed"
        else
          flags=""
        fi

        # Large media trees are mounted under /host; skip them so the OS scan
        # does not walk terabytes of media files. Paths are as seen inside this
        # container, i.e. under /host.
        skips=""
        for dir in $$SKIP_DIRS; do
          skips="$$skips --skip-dirs $$dir"
        done

        # Warns instead of failing, and avoids `cmd \` + `||` continuations, which
        # are the fragile part of this script: any trailing whitespace after a
        # backslash silently breaks the continuation.
        warn() { echo "WARN: $$1"; }

        # 1. Enumerate images up front, before the long OS scan, so the list is
        #    visible in the first second and an API problem surfaces immediately
        #    rather than after several minutes of rootfs scanning.
        #
        #    Parse the array before splitting on commas. Splitting first breaks any
        #    image with more than one tag, because the later tags no longer sit on
        #    a line containing "RepoTags":[ and the per-line match silently misses
        #    them.
        if command -v curl >/dev/null 2>&1; then
          # -f and -S so an HTTP error is not parsed as an empty list. Every
          # failure mode below otherwise looks like an empty daemon and silently
          # produces zero image reports.
          if ! raw="$$(curl -fsS --connect-timeout 10 \
            -H "Accept: application/json" \
            "$$DOCKER_API/v1.44/images/json")"; then
            echo "ERROR: cannot list images via $$DOCKER_API"
            echo "ERROR: check the proxy is up and reachable:"
            echo "ERROR:   docker compose -f docker-compose.trivy.yml ps docker-api"
            echo "ERROR:   docker compose -f docker-compose.trivy.yml logs docker-api"
            echo "ERROR: and that the scan service shares its network:"
            echo "ERROR:   docker compose -f docker-compose.trivy.yml run --rm scan"
            echo "ERROR: A 403 here means the proxy denied IMAGES/CONTAINERS."
            raw=""
          fi
          images="$$(printf '%s' "$$raw" \
            | grep -o '"RepoTags":\[[^]]*\]' \
            | sed 's/^"RepoTags":\[//; s/\]$//' \
            | tr ',' '\n' \
            | tr -d '"' \
            | grep -v '^<none>' \
            | grep -v '^$$' \
            | sort -u)"
        else
          echo "ERROR: curl unavailable; set TRIVY_SCAN_IMAGES to scan specific"
          echo "ERROR: images manually."
          images=""
        fi

        # Deduplicate: an image passed via TRIVY_SCAN_IMAGES is often already in the
        # daemon list, and scanning it twice writes the same report twice.
        targets="$$(printf '%s\n' $$images $$IMAGES | grep -v '^$$' | sort -u)"

        echo
        echo "=== Images to scan: $$(printf '%s\n' "$$targets" | grep -c .) ==="
        printf '%s\n' "$$targets" | grep -v '^$$' | nl -w4 -s'. ' || true
        echo

        # 2. Host OS packages (deb/rpm/apk) + secrets across the host filesystem.
        set -x
        if ! trivy rootfs $$flags $$skips --scanners vuln,secret \
             --format template --template '@/contrib/html.tpl' \
             --output "$$REPORT_DIR/os-report.html" /host; then
          warn "os html scan failed"
        fi
        if ! trivy rootfs $$flags $$skips --scanners vuln,secret \
             --format json --output "$$REPORT_DIR/os-report.json" /host; then
          warn "os json scan failed"
        fi

        if [ "$$SBOM" = "true" ]; then
          if ! trivy rootfs $$skips --scanners "" --list-all-pkgs \
               --format cyclonedx \
               --output "$$REPORT_DIR/sbom-os.cdx.json" /host; then
            warn "os sbom failed"
          fi
          if ! trivy rootfs $$skips --scanners "" \
               --format spdx-json \
               --output "$$REPORT_DIR/sbom-os.spdx.json" /host; then
            warn "os spdx sbom failed"
          fi
        fi
        set +x

        # 3. Per-image reports: HTML vulnerability report plus SBOMs.
        count=0
        for image in $$targets; do
          slug="$$(printf '%s' "$$image" | tr '/:' '__')"
          echo "==> scanning $$image"
          set -x
          if ! trivy image $$flags --scanners vuln,secret \
               --docker-host "$$DOCKER_API" \
               --format template --template '@/contrib/html.tpl' \
               --output "$$REPORT_DIR/image-$$slug.html" "$$image"; then
            warn "failed $$image"
          fi

          if [ "$$SBOM" = "true" ]; then
            if ! trivy image --scanners "" --list-all-pkgs --format cyclonedx \
                 --docker-host "$$DOCKER_API" \
                 --output "$$REPORT_DIR/sbom-image-$$slug.cdx.json" "$$image"; then
              warn "sbom failed $$image"
            fi
            if ! trivy image --scanners "" --format spdx-json \
                 --docker-host "$$DOCKER_API" \
                 --output "$$REPORT_DIR/sbom-image-$$slug.spdx.json" "$$image"; then
              warn "spdx sbom failed $$image"
            fi
          fi
          set +x

          count=$$((count + 1))
        done
        echo "Scanned $$count image(s)"

        # 4. Console summary of HIGH/CRITICAL across the host OS
        set -x
        trivy rootfs $$flags $$skips --scanners vuln --severity "$$SEVERITY" /host || true
        set +x

        echo "Reports written to $$REPORT_DIR:"
        ls -la "$$REPORT_DIR"

networks:
  trivy:
    driver: bridge

volumes:
  # Named volumes, with explicit names so docker-compose.monitoring.yml can
  # attach to them as external. Named volumes are chowned to the image's
  # runtime user, so uid 1001 can write without depending on host bind-mount
  # ownership.
  #
  # Trivy takes an exclusive lock on its cache dir, so the server and the scan
  # job must not share one.
  trivy-db:
    name: rossmoney_trivy-db
  trivy-db-scan:
    name: rossmoney_trivy-db-scan
  # Report tree, served by docker-compose.monitoring.yml at /trivy/.
  monitoring-reports:
    external: true
    name: rossmoney_monitoring-reports
