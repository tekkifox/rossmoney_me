name: Lint

on:
  pull_request:
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/lint.yml'

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"

      # Node 26 no longer bundles corepack; install it explicitly, pinned.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      # There is a root package.json now, so Corepack resolves pnpm's version
      # from `packageManager` at the repository root.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Run oxlint
        run: corepack pnpm --filter payload-cms run lint
