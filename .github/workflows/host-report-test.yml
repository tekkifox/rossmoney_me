name: Host Report Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'tools/host-report/**'
      - '.github/workflows/host-report-test.yml'
  pull_request:
    paths:
      - 'tools/host-report/**'
      - '.github/workflows/host-report-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/host-report
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile
        run: python3 -m compileall -q .

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
