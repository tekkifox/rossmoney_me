name: Build and Publish CMS Image (dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'payload-cms/**'
      - '.github/workflows/cms-publish-dev.yml'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: cms-publish-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./payload-cms
          file: ./payload-cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Confirm Portainer deployment and prune host dangling images
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        env:
          PORTAINER_API_URL: ${{ secrets.PORTAINER_API_URL_DEV }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN_DEV }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID_DEV }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_DEV }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER_DEV }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_DEV }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS_DEV }}
          PORTAINER_DEPLOY_TIMEOUT_SECONDS: '900'
        run: python3 deploy/portainer_deploy.py
