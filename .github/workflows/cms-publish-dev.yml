name: Build and Publish CMS Image (dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cms-publish-dev.yml'
  workflow_dispatch:

concurrency:
  group: cms-publish-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push linux/amd64 by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=payload-dev-amd64
          cache-to: type=gha,mode=max,scope=payload-dev-amd64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/digest
          retention-days: 1

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push linux/arm64 by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=payload-dev-arm64
          cache-to: type=gha,mode=max,scope=payload-dev-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs:
      - build
      - build-arm64
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Download linux/amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: /tmp/digests/amd64

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/amd64/digest)" \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

      - name: Redeploy Portainer stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_NAME: rossmoney_me
        run: |
          set -euo pipefail

          PORTAINER_URL="${PORTAINER_URL%/}"

          # Find the stack by name; never hardcode Id or EndpointId. Stacks are
          # re-created when the hub's environments change, so both move.
          stacks_status=$(curl -sS -o /tmp/stacks.json -w '%{http_code}' \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")
          if [ "$stacks_status" -lt 200 ] || [ "$stacks_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks failed with HTTP ${stacks_status}"
            cat /tmp/stacks.json
            exit 1
          fi

          match_count=$(jq --arg name "$STACK_NAME" \
            '[.[] | select(.Name == $name)] | length' /tmp/stacks.json)
          if [ "$match_count" -eq 0 ]; then
            echo "No Portainer stack named '${STACK_NAME}' in /api/stacks"
            cat /tmp/stacks.json
            exit 1
          fi
          if [ "$match_count" -gt 1 ]; then
            echo "More than one Portainer stack named '${STACK_NAME}'; refusing to guess"
            jq --arg name "$STACK_NAME" \
              '[.[] | select(.Name == $name) | {Id, EndpointId}]' /tmp/stacks.json
            exit 1
          fi

          stack_id=$(jq -r --arg name "$STACK_NAME" \
            '.[] | select(.Name == $name) | .Id' /tmp/stacks.json)

          # Read the stack itself to carry its existing environment forward.
          get_status=$(curl -sS -o /tmp/stack.json -w '%{http_code}' \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}")
          if [ "$get_status" -lt 200 ] || [ "$get_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks/${stack_id} failed with HTTP ${get_status}"
            cat /tmp/stack.json
            exit 1
          fi

          endpoint_id=$(jq -r '.EndpointId // empty' /tmp/stack.json)
          if [ -z "$endpoint_id" ]; then
            echo "Portainer stack '${STACK_NAME}' (Id=${stack_id}) has no EndpointId"
            cat /tmp/stack.json
            exit 1
          fi

          env_json=$(jq -c '.Env // []' /tmp/stack.json)
          echo "Found stack '${STACK_NAME}': Id=${stack_id}, EndpointId=${endpoint_id}"

          # Preserve the stack's current compose file; only pull the new image.
          file_status=$(curl -sS -o /tmp/stack-file.json -w '%{http_code}' \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}/file")
          if [ "$file_status" -lt 200 ] || [ "$file_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks/${stack_id}/file failed with HTTP ${file_status}"
            cat /tmp/stack-file.json
            exit 1
          fi

          stack_file_content=$(jq -j '.StackFileContent // empty' /tmp/stack-file.json)
          if [ -z "$stack_file_content" ]; then
            echo "Portainer /api/stacks/${stack_id}/file returned no StackFileContent"
            cat /tmp/stack-file.json
            exit 1
          fi

          # The stack must actually run the image this workflow publishes, not
          # another environment's. Refuse to restart a stack that does not.
          if ! grep -q 'rossmoney_me-cms:dev' <<< "$stack_file_content"; then
            echo "Portainer stack '${STACK_NAME}' (Id=${stack_id}) does not reference rossmoney_me-cms:dev; refusing to redeploy it"
            exit 1
          fi

          body=$(jq -n \
            --arg compose "$stack_file_content" \
            --argjson env "$env_json" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}')

          put_status=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}")
          if [ "$put_status" -lt 200 ] || [ "$put_status" -ge 300 ]; then
            echo "Portainer PUT /api/stacks/${stack_id}?endpointId=${endpoint_id} failed with HTTP ${put_status}"
            cat /tmp/put.json
            exit 1
          fi

          echo "Portainer stack '${STACK_NAME}' redeployed (id=${stack_id}, endpointId=${endpoint_id})"
