name: Build and Publish CMS Image (dev)

on:
  push:
    branches:
      - dev
    paths:
      - 'payload-cms/**'
      - '.github/workflows/cms-publish-dev.yml'
  workflow_dispatch:

concurrency:
  group: cms-publish-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./payload-cms
          file: ./payload-cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Portainer webhook
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$PORTAINER_WEBHOOK_URL")
          if [ "$status" != "200" ] && [ "$status" != "202" ] && [ "$status" != "204" ]; then
            echo "Portainer webhook failed with HTTP $status"
            exit 1
          fi
