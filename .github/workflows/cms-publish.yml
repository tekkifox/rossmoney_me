name: Build and Publish CMS Image

on:
  push:
    branches:
      - main
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cms-publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms

jobs:
  # The image is built for linux/arm64 only. Its sole consumer is the
  # rossmoney-cms stack on rossmoney, which is an aarch64 host, and nothing
  # pulls an amd64 build of `latest`.
  #
  # The runner is GitHub's hosted arm64 machine, so the build is native: no
  # QEMU setup action and no multi-`platforms:` cross-build, both of which were
  # only there for the amd64 leg of the old multi-arch manifest.
  build:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push linux/arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # `tags:` alone only names the image; without this the build stays in
          # the local cache and nothing reaches ghcr.io.
          push: true
          cache-from: type=gha,scope=payload-main-arm64
          cache-to: type=gha,mode=max,scope=payload-main-arm64

  # Stacks are files on the fleet's hosts, applied by Ansible. The deploy job
  # asks the deploy gateway over the tailnet to pull and recreate the named
  # stacks on the named host. The image it pulls is the `latest` tag this
  # workflow just published to ghcr.io.
  #
  # It runs on a GitHub-hosted runner, joins the tailnet with a reusable
  # ephemeral auth key, and authenticates to the gateway with its own key and
  # pinned host key.
  deploy:
    name: Deploy the CMS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-rossmoney-me-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy rossmoney rossmoney-cms"
