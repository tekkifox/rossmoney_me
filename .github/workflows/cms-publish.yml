name: Build and Publish CMS Image

on:
  push:
    branches:
      - main
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cms-publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms

jobs:
  # The image is built for linux/arm64 only. Its sole consumer is the
  # rossmoney-cms stack on rossmoney, which is an aarch64 host, and nothing
  # pulls an amd64 build of `latest`.
  #
  # The runner is GitHub's hosted arm64 machine, so the build is native: no
  # QEMU setup action and no multi-`platforms:` cross-build, both of which were
  # only there for the amd64 leg of the old multi-arch manifest.
  build:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push linux/arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          # `tags:` alone only names the image; without this the build stays in
          # the local cache and nothing reaches ghcr.io.
          push: true
          cache-from: type=gha,scope=payload-main-arm64
          cache-to: type=gha,mode=max,scope=payload-main-arm64

  # Stacks are files on the fleet's hosts, applied by Ansible, so the deploy is
  # delegated to the fleet's deploy seat on mgmt: it pulls and recreates the
  # named stacks on the named host, and refuses a stack its host does not
  # declare. The image it pulls is the `latest` tag this workflow just
  # published to ghcr.io.
  #
  # This job is deliberately self-contained rather than a call to the fleet's
  # reusable deploy workflow. That workflow lives in a private repository, and
  # GitHub refuses to load a workflow in a public repository that calls a
  # reusable workflow in a private one, so the call would fail before any job
  # ran. The SSH invocation is duplicated here; that duplication is the price
  # of this repository being public. The seat validates host and stack itself,
  # so this job is only transport.
  #
  # Runs on the self-hosted fleet runner (already on the tailnet), so no
  # Tailscale join step is needed. The deploy SSH key is taken from a
  # preinstalled file at `$HOME/.ssh/deploy` when present (as fleet deploy
  # workflows do); otherwise the `DEPLOY_SSH_KEY` secret is written there as a
  # fallback. The seat's address comes from the `DEPLOY_SEAT_HOST` secret
  # because this repository is public and must not publish a real hostname.
  deploy:
    name: Deploy the CMS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, paseo]
    steps:
      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: rossmoney
          TARGET_STACKS: rossmoney-cms
        run: |
          set -euo pipefail
          if [ -f "$HOME/.ssh/deploy" ]; then
            echo "Using preinstalled deploy key at $HOME/.ssh/deploy"
          else
            if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
              echo "::error::No preinstalled deploy key at $HOME/.ssh/deploy and DEPLOY_SSH_KEY secret is not set"
              exit 1
            fi
            install -d -m 0700 "$HOME/.ssh"
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
            chmod 0600 "$HOME/.ssh/deploy"
          fi
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
