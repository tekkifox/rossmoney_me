name: Build and Publish CMS Image

on:
  push:
    branches:
      - main
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cms-publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rossmoney_me-cms

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push linux/amd64 by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=payload-main-amd64
          cache-to: type=gha,mode=max,scope=payload-main-amd64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: /tmp/digests/digest
          retention-days: 1

  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push linux/arm64 by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./payload-cms/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=payload-main-arm64
          cache-to: type=gha,mode=max,scope=payload-main-arm64

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/digest

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: /tmp/digests/digest
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs:
      - build
      - build-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download linux/amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-amd64
          path: /tmp/digests/amd64

      - name: Download linux/arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digest-arm64
          path: /tmp/digests/arm64

      - name: Publish multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/amd64/digest)" \
            "${{ env.IMAGE_NAME }}@$(cat /tmp/digests/arm64/digest)"

  # Stacks are files on the fleet's hosts, applied by Ansible, so the deploy is
  # delegated to the fleet's deploy seat on mgmt: it pulls and recreates the
  # named stacks on the named host, and refuses a stack its host does not
  # declare. The image it pulls is the `latest` tag this workflow just
  # published to ghcr.io.
  #
  # This job is deliberately self-contained rather than a call to the fleet's
  # reusable deploy workflow. That workflow lives in a private repository, and
  # GitHub refuses to load a workflow in a public repository that calls a
  # reusable workflow in a private one, so the call would fail before any job
  # ran. The tailnet join and the SSH invocation are therefore duplicated here;
  # that duplication is the price of this repository being public. The seat
  # validates host and stack itself, so this job is only transport.
  #
  # Requires the `DEPLOY_SSH_KEY` secret (the deploy-only key). It is not in
  # this repository yet; the job fails at the key step until it is added. The
  # seat's address comes from the `DEPLOY_SEAT_HOST` secret because this
  # repository is public and must not publish a real hostname.
  deploy:
    name: Deploy the CMS
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-cms-${{ github.run_id }}

      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: rossmoney
          TARGET_STACKS: rossmoney-cms
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
