name: Dependency audit

on:
  pull_request:
  schedule:
    # Catch advisories published after the last PR, even when nothing changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"

      # Node 26 no longer bundles corepack; install it explicitly, pinned.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install dependencies
        working-directory: payload-cms
        run: corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Audit production dependencies
        working-directory: payload-cms
        run: corepack pnpm run audit:prod
