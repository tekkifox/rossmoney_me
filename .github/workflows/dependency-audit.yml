name: Dependency audit

# Automatic triggers are disabled. The audit no longer runs on pull requests or
# on its weekly schedule; run it by hand from the Actions tab when needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"

      # Node 26 no longer bundles corepack; install it explicitly, pinned.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Audit production dependencies
        run: corepack pnpm --filter payload-cms run audit:prod
