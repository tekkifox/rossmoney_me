name: Generate sitemap

on:
  push:
    branches: 
      - main
    paths:
      - 'payload-cms/**'
      - '.github/workflows/generate-sitemap.yml'
  pull_request:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Install dependencies (payload-cms)
        run: |
          cd payload-cms
          pnpm install --frozen-lockfile

      - name: Generate sitemap and robots
        run: |
          cd payload-cms
          pnpm generate:sitemap

      - name: Upload sitemap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sitemap-files
          path: |
            payload-cms/public/sitemap.xml
            payload-cms/public/robots.txt
