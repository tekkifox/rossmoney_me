name: Generate sitemap

on:
  push:
    branches: 
      - main
    paths:
      - 'payload-cms/**'
      - '.github/workflows/generate-sitemap.yml'
  pull_request:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap and robots
        run: |
          node ./payload-cms/scripts/generate-sitemap.cjs

      - name: Upload sitemap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-files
          path: |
            payload-cms/public/sitemap.xml
            payload-cms/public/robots.txt
