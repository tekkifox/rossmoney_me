name: Browser smoke

on:
  pull_request:
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/browser-smoke.yml'

concurrency:
  # The mongo port is chosen per run, so the database no longer collides. The
  # app under test still cannot move off port 3000 without a code change: the
  # legacy e2e specs and tests/helpers/login.ts hardcode
  # `http://localhost:3000`, so a second run would fail on a host port already
  # in use. Not keyed by ref: queue runs from every branch instead of letting
  # one start and fail.
  group: browser-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, paseo]
    timeout-minutes: 30

    env:
      CI: true
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: browser-smoke-ci-secret
      # Live Preview builds this into the iframe URL and checks it on the
      # preview route, so both processes need the same value.
      PREVIEW_SECRET: browser-smoke-preview-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The service container published a fixed host port (27017), so two smoke
      # runs could never overlap on a shared runner. Start mongo ourselves on a
      # port the kernel picks: `-p 127.0.0.1::27017` leaves the host port empty
      # and `docker port` reads back the one that was assigned. Bound to
      # 127.0.0.1 only, so the database is not reachable from the LAN.
      #
      # The production server and the Playwright worker must see the same
      # database: the worker seeds the admin account directly through Payload.
      - name: Start MongoDB
        run: |
          set -euo pipefail
          NAME="mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$NAME" -p 127.0.0.1::27017 mongo:9

          ADDR=$(docker port "$NAME" 27017/tcp)
          PORT="${ADDR##*:}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read a host port for $NAME (docker port said '$ADDR')"
            exit 1
          fi

          echo "MONGO_CONTAINER=$NAME" >> "$GITHUB_ENV"
          echo "MONGODB_URI=mongodb://127.0.0.1:${PORT}/rossmoney_smoke" >> "$GITHUB_ENV"
          echo "MongoDB container $NAME listening on 127.0.0.1:${PORT}"

          # The service container's health check used to cover readiness. Poll
          # the container instead, bounded, so the suites never race the first
          # boot and a dead container fails here with its logs rather than in
          # Playwright.
          for attempt in $(seq 1 60); do
            if OUT=$(docker exec "$NAME" mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null) && [ "$OUT" = "1" ]; then
              echo "MongoDB ready after ${attempt} attempt(s)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != "true" ]; then
              echo "::error::MongoDB container exited during startup"
              docker logs "$NAME" || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::MongoDB did not answer a ping within 120s"
          docker logs "$NAME" || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack; install it explicitly, pinned.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      # There is a root package.json now, so Corepack resolves pnpm's version
      # from `packageManager` at the repository root.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build production app
        run: corepack pnpm --filter payload-cms run build

      # The runner hosts Chromium's system libraries already, so this only
      # downloads the browsers the config's projects use (chromium and
      # firefox) at the version pinned in payload-cms/package.json. No
      # `--with-deps`: that shells out to sudo, which the runner user does
      # not have.
      - name: Install Playwright browsers
        run: >-
          corepack pnpm --filter payload-cms exec playwright install
          chromium firefox

      # Playwright starts the production server itself (see webServer in
      # payload-cms/playwright.config.ts). `CI=true` selects `pnpm start` and
      # disables reusing a stray dev server.
      - name: Run browser smoke suite
        run: corepack pnpm --filter payload-cms run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            payload-cms/playwright-report
            payload-cms/test-results
          if-no-files-found: ignore
          retention-days: 7

      # Always remove the container, so a failed, cancelled or aborted run
      # leaves no mongo process behind on the shared runner.
      - name: Remove MongoDB container
        if: always()
        run: |
          NAME="${MONGO_CONTAINER:-mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if docker inspect "$NAME" > /dev/null 2>&1; then
            docker rm -f "$NAME"
          fi
