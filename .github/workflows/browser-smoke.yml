name: Browser smoke

on:
  pull_request:
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'payload-cms/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/browser-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    # Pull-request code must never run on the operator's own infrastructure: a
    # malicious PR would execute as the self-hosted runner's user. This job
    # therefore runs only on a GitHub-hosted runner, for pull requests and for
    # `main`/`dev` pushes alike. The self-hosted `paseo` runner still serves the
    # publish, lint and token-guard jobs; nothing here depends on it.
    #
    # Because each run gets a fresh VM, there is no shared host port 3000 to
    # serialise on, so these runs may overlap and no concurrency group is
    # needed.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: browser-smoke-ci-secret
      # Live Preview builds this into the iframe URL and checks it on the
      # preview route, so both processes need the same value.
      PREVIEW_SECRET: browser-smoke-preview-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The mongo service container used to publish a fixed host port (27017),
      # so two smoke runs could never overlap. Start mongo ourselves on a port
      # the kernel picks instead: `-p 127.0.0.1::27017` leaves the host port
      # empty and `docker port` reads back the one that was assigned. Bound to
      # 127.0.0.1 only, so the database is not left reachable from anywhere
      # else on the runner's network. Docker is preinstalled on ubuntu-latest.
      #
      # The production server and the Playwright worker must see the same
      # database: the worker seeds the admin account directly through Payload.
      - name: Start MongoDB
        run: |
          set -euo pipefail
          NAME="mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$NAME" -p 127.0.0.1::27017 mongo:9

          ADDR=$(docker port "$NAME" 27017/tcp)
          PORT="${ADDR##*:}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read a host port for $NAME (docker port said '$ADDR')"
            exit 1
          fi

          echo "MONGO_CONTAINER=$NAME" >> "$GITHUB_ENV"
          echo "MONGODB_URI=mongodb://127.0.0.1:${PORT}/rossmoney_smoke" >> "$GITHUB_ENV"
          echo "MongoDB container $NAME listening on 127.0.0.1:${PORT}"

          # The service container's health check used to cover readiness. Poll
          # the container instead, bounded, so the suites never race the first
          # boot and a dead container fails here with its logs rather than in
          # Playwright.
          for attempt in $(seq 1 60); do
            if OUT=$(docker exec "$NAME" mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null) && [ "$OUT" = "1" ]; then
              echo "MongoDB ready after ${attempt} attempt(s)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != "true" ]; then
              echo "::error::MongoDB container exited during startup"
              docker logs "$NAME" || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::MongoDB did not answer a ping within 120s"
          docker logs "$NAME" || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      # Node 26 no longer bundles corepack; install it explicitly, pinned.
      # The pnpm version comes from `packageManager` in package.json.
      - name: Enable Corepack
        run: npm i -g corepack@0.36.0 && corepack enable

      # There is a root package.json now, so Corepack resolves pnpm's version
      # from `packageManager` at the repository root.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build production app
        run: corepack pnpm --filter payload-cms run build

      # The hosted runner image carries build tools, not Playwright's browser
      # dependencies. `--with-deps` installs the matching apt packages through
      # the runner's passwordless sudo, then Playwright downloads the browsers
      # the config's projects use (chromium and firefox) at the version pinned
      # in payload-cms/package.json.
      - name: Install Playwright browsers
        run: >-
          corepack pnpm --filter payload-cms exec playwright install
          --with-deps chromium firefox

      # Playwright starts the production server itself (see webServer in
      # payload-cms/playwright.config.ts). `CI=true` selects `pnpm start` and
      # disables reusing a stray dev server.
      - name: Run browser smoke suite
        run: corepack pnpm --filter payload-cms run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            payload-cms/playwright-report
            payload-cms/test-results
          if-no-files-found: ignore
          retention-days: 7

      # Always remove the container, so a failed, cancelled or aborted run
      # stops mongo before the job's VM is destroyed.
      - name: Remove MongoDB container
        if: always()
        run: |
          NAME="${MONGO_CONTAINER:-mongo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if docker inspect "$NAME" > /dev/null 2>&1; then
            docker rm -f "$NAME"
          fi
