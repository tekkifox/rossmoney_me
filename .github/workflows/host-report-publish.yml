name: Build and Publish Host Report Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'tools/host-report/**'
      - '.github/workflows/host-report-publish.yml'
  workflow_dispatch:

concurrency:
  group: host-report-publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rossmoney_me-host-report

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: tools/host-report
          file: tools/host-report/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=host-report
          cache-to: type=gha,mode=max,scope=host-report

      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ github.ref == 'refs/heads/dev' && secrets.PORTAINER_WEBHOOK_URL_DEV || secrets.PORTAINER_WEBHOOK_URL }}
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$PORTAINER_WEBHOOK_URL")
          if [ "$status" != "200" ] && [ "$status" != "202" ] && [ "$status" != "204" ]; then
            echo "Portainer webhook failed with HTTP $status"
            exit 1
          fi
