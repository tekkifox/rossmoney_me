name: Token guard

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    runs-on: [self-hosted, paseo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for raw colour literals
        run: node payload-cms/scripts/check-tokens.mjs
