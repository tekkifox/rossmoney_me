backend:
  name: mongo
  api_root: /api/cms

site_url: /
display_url: /

collections:
  - name: pages
    label: Site Pages
    files:
      - name: home
        label: Home Page
        file: content/pages/home.json
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Lead, name: lead, widget: text }
          - label: Primary Button
            name: primaryButton
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Secondary Button
            name: secondaryButton
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
          - label: Metrics
            name: metrics
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Focus Panel
            name: focus
            widget: object
            fields:
              - { label: Kicker, name: kicker, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Status, name: status, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: text }
      - name: contact
        label: Contact Section
        file: content/pages/contact.json
        format: json
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Lead, name: lead, widget: text }
          - label: Links
            name: links
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }

  - name: projects
    label: Work Projects
    folder: content/projects
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - { label: Order, name: order, widget: number, value_type: int, default: 1 }

  - name: experience
    label: Experience
    folder: content/experience
    create: true
    slug: '{{slug}}'
    extension: json
    format: json
    fields:
      - { label: Year, name: year, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Organization, name: organization, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Highlights
        name: highlights
        widget: list
        field: { label: Highlight, name: highlight, widget: string }
      - { label: Order, name: order, widget: number, value_type: int, default: 1 }
