version: "3.8"

# Report dashboard. See monitoring/README.md.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# No host ports are published; the dashboard is on the external `proxy` network
# at 172.18.0.22:8083. Reports come from the rossmoney_monitoring-reports volume,
# written by the trivy stack as uid 1001 and the host Lynis cron as root.

services:
  # Renders lynis-report.dat into HTML. One-shot; the host cron re-runs it daily.
  lynis-converter:
    build:
      context: ./lynis
      dockerfile: converter.Dockerfile
    image: rossmoney-lynis-converter:latest
    user: "1001:1001"
    volumes:
      - monitoring-reports:/reports
    depends_on:
      reports-init:
        condition: service_completed_successfully
    networks:
      - monitor
    # Exits 0 when no report exists, so a fresh volume does not block the dashboard.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        report=/reports/lynis-report.dat

        if [ ! -f "$$report" ]; then
          echo "SKIP: $$report not present yet."
          echo "SKIP: Generate one with the host cron, or run Lynis directly:"
          echo "SKIP:   lynis audit system --quick --report-file $$report"
          exit 0
        fi

        echo "Converting $$report"
        set -x
        if lynis-report-converter --input "$$report" \
             --output /reports/lynis-report.html; then
          chmod 644 /reports/lynis-report.html
          echo "Wrote /reports/lynis-report.html"
        else
          echo "ERROR: conversion failed; is lynis-report.html stale?"
          exit 1
        fi
        set +x
    restart: "no"

  # Chowns the report volume to 1001:1001. Docker creates named volumes
  # root-owned, so this must run before the scanner writes or nginx reads.
  reports-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - monitoring-reports:/reports
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        # rm is legacy cleanup: earlier revisions mounted the volume over
        # /usr/share/nginx/html, which seeded it with nginx's stock index.html.
        rm -f /reports/index.html

        chown -R ${REPORT_UID:-1001}:${REPORT_GID:-1001} /reports
        chmod -R a+rX /reports
        echo "monitoring-reports set to $(stat -c '%u:%g %a' /reports), $(find /reports -type f | wc -l) file(s)"
    restart: "no"

  # nginx runs as 1001:1001 to match the report ownership, so group-read bits
  # suffice. Port 8083 is unprivileged; tmpfs covers the paths nginx writes to.
  dashboard:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    image: rossmoney-monitoring-dashboard:latest
    user: "1001:1001"
    tmpfs:
      - /var/cache/nginx:uid=1001,gid=1001,mode=0700
      - /var/run:uid=1001,gid=1001,mode=0755
      - /tmp:uid=1001,gid=1001,mode=1777
    depends_on:
      reports-init:
        condition: service_completed_successfully
      lynis-converter:
        condition: service_completed_successfully
    volumes:
      - monitoring-reports:/reports:ro
    expose:
      - "8083"
    networks:
      proxy:
        ipv4_address: 172.18.0.22
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitor:
    driver: bridge
  # Created by the reverse proxy stack, which owns the subnet.
  proxy:
    external: true
    name: proxy

volumes:
  # Created by whichever writer runs first, then chowned by reports-init.
  monitoring-reports:
    name: rossmoney_monitoring-reports
