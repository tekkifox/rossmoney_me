version: "3.8"

services:
  cms:
    build:
      context: ./payload-cms
      dockerfile: Dockerfile
    env_file:
      - stack.env
    restart: unless-stopped
    environment:
      PORT: "8082"
    ports:
      - "8082:8082"
    networks:
      - rossmoney-stack
    volumes:
      - /app/.next
      - /app/node_modules
      - payload-media:/app/public/media:rw
    depends_on:
      - mongo

  mongo:
    image: mongo:9
    restart: unless-stopped
    networks:
      - rossmoney-stack
    volumes:
      - mongo-data:/data/db

  # ArchView is a separate stack (ghcr.io/tekkifox/archview) served at
  # archview.rossmoney.me. It brings its own socket proxy because it is the only
  # consumer of the Docker API, so neither container belongs here. The CMS
  # reaches it server-side through the /api/architecture proxy.

networks:
  rossmoney-stack:
    driver: bridge

volumes:
  mongo-data:
  payload-media:
