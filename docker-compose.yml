version: "3.8"

services:
  web:
    image: ghcr.io/tekkifox/rossmoney_me:latest
    pull_policy: always
    networks:
      - rossmoney-stack
    depends_on:
      - archview

  archview:
    image: ghcr.io/tekkifox/archview:latest
    pull_policy: always
    environment:
      PORT: "8080"
      DOCKER_API_VERSION: "v1.44"
      DOCKER_HOST: "tcp://socket-proxy:2375"
      HOST_PROC: "/host/proc"
      HOST_SYS: "/host/sys"
      HOST_ROOT: "/host/root"
    networks:
      - rossmoney-stack
    depends_on:
      socket-proxy:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
      LOG_LEVEL: info
    networks:
      - rossmoney-stack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  proxy:
    image: ghcr.io/tekkifox/rossmoney_me-proxy:latest
    pull_policy: always
    depends_on:
      - web
      - archview
    networks:
      - rossmoney-stack
      - proxy

networks:
  proxy:
    external: true
  rossmoney-stack:
    driver: bridge