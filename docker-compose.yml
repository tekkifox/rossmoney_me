version: "3.8"

services:
  cms-api:
    build:
      context: ./payload-cms
      dockerfile: Dockerfile
    env_file:
      - stack.env
    restart: unless-stopped
    environment:
      PORT: "8082"
    ports:
      - "8082:8082"
    networks:
      - rossmoney-stack
    volumes:
      - /app/.next
      - /app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    networks:
      - rossmoney-stack
    volumes:
      - mongo-data:/data/db

  archview:
    image: ghcr.io/tekkifox/archview:latest
    pull_policy: always
    env_file:
      - stack.env
    environment:
      PORT: "8080"
    networks:
      - rossmoney-stack
    depends_on:
      socket-proxy:
        condition: service_healthy
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  # proxy service removed: CMS now proxies /api/architecture through its Next API route

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    env_file:
      - stack.env
    networks:
      - rossmoney-stack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  rossmoney-stack:
    driver: bridge

volumes:
  mongo-data:
