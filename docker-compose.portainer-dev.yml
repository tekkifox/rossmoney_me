version: "3.8"
services:
  cms:
    image: ghcr.io/tekkifox/rossmoney_me-cms:dev
    pull_policy: always
    hostname: rossmoney_me-cms-dev-1
    env_file:
      - stack.env
    restart: unless-stopped
    environment:
      PORT: "8083"
    ports:
      - "8083:8083"
    networks:
      - rossmoney-stack-dev
      - proxy
    depends_on:
      - mongo
    volumes:
      - payload-media-dev:/app/payload-cms/public/media:rw

  mongo:
    image: mongo:9
    restart: unless-stopped
    env_file:
      - stack.env
    networks:
      - rossmoney-stack-dev
    volumes:
      - mongo-data-dev:/data/db

  # Same daily report, built from the dev tag. Dry-run by default so the dev
  # stack does not post a second copy of the production message; set
  # HOST_REPORT_DRY_RUN=0 in this stack's stack.env to let it send.
  host-report:
    image: ghcr.io/tekkifox/rossmoney_me-host-report:dev
    pull_policy: always
    hostname: rossmoney-host-report-dev-1
    env_file:
      - stack.env
    restart: unless-stopped
    environment:
      ORACLE_TNS_ADMIN: /wallet
      HOST_REPORT_DRY_RUN: "${HOST_REPORT_DRY_RUN:-1}"
    volumes:
      - ${ORACLE_WALLET_DIR:-./Wallet_rossadb}:/wallet:ro
    networks:
      - rossmoney-stack-dev

  # ArchView is a separate stack (ghcr.io/tekkifox/archview) served at
  # archview.rossmoney.me. It brings its own socket proxy because it is the only
  # consumer of the Docker API, so neither container belongs here. The CMS
  # reaches it server-side through the /api/architecture proxy.

networks:
  rossmoney-stack-dev:
    driver: bridge
  # Created by the openresty stack that terminates TLS for dev.rossmoney.me.
  proxy:
    external: true

volumes:
  mongo-data-dev:
  payload-media-dev:
